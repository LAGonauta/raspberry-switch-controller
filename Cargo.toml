[package]
name = "raspberry-switch-controller"
version = "0.1.0"
edition = "2021"
authors = ["raspberry-switch-controller"]
description = "Bridge Xbox wireless controllers to a Nintendo Switch over USB OTG gadget mode"

[dependencies]
gilrs = "0.11.2"
flume = "0.12.0"
ctrlc = "3.5.2"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2"
log = "0.4"
pretty_env_logger = "0.5.0"
governor = "0.6"
wiimote-rs = "0.2"
crossterm = "0.29"
ratatui = "0.30.2"

[profile.release]
lto = true
